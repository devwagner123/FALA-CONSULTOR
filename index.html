<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="FALA CONSULTOR"/>
<meta name="theme-color" content="#070d1a"/>
<title>FALA CONSULTOR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#070d1a}select option{background:#0d1630;color:#e8f0fe}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const AGENCIES=[
  {id:"44",prefix:"44",name:"AV CALAMA",group:"SUP RONDONIA",wallets:[7002]},
  {id:"102",prefix:"102",name:"PORTO VELHO",group:"SUP RONDONIA",wallets:[5050,7002]},
  {id:"390",prefix:"390",name:"GUAJARA MIRIM",group:"SUP RONDONIA",wallets:[155,5025,7002]},
  {id:"951",prefix:"951",name:"JI PARANA",group:"SUP RONDONIA",wallets:[142,145,148,172,7002]},
  {id:"1178",prefix:"1178",name:"ARIQUEMES",group:"SUP RONDONIA",wallets:[159,161,162,163,5028,7002]},
  {id:"1401",prefix:"1401",name:"JARU",group:"SUP RONDONIA",wallets:[130,131,156,157,158,159,168,5090,7002]},
  {id:"2184",prefix:"2184",name:"ALVORADA DO OESTE",group:"SUP RONDONIA",wallets:[144,146,148,7002]},
  {id:"2265",prefix:"2265",name:"MACHADINHO",group:"SUP RONDONIA",wallets:[119,140,144,153,7002]},
  {id:"2290",prefix:"2290",name:"PRESIDENTE DUTRA",group:"PRESIDENTE DUTRA",wallets:[7002]},
  {id:"3181",prefix:"3181",name:"NAÇÕES UNIDAS",group:"SUP RONDONIA",wallets:[142,7002]},
  {id:"3231",prefix:"3231",name:"NOVA BRASILANDIA",group:"PRESIDENTE DUTRA",wallets:[7002]},
  {id:"3885",prefix:"3885",name:"AV AMAZONAS",group:"SUP RONDONIA",wallets:[7002]},
  {id:"3997",prefix:"3997",name:"ALTO PARAISO",group:"SUP RONDONIA",wallets:[140,137,7002]},
  {id:"4000",prefix:"4000",name:"MINISTRO ANDREAZZA",group:"PRESIDENTE DUTRA",wallets:[7002]},
  {id:"4001",prefix:"4001",name:"MIRANTE DA SERRA",group:"SUP RONDONIA",wallets:[145,147,148,7002]},
  {id:"4002",prefix:"4002",name:"MONTE NEGRO",group:"SUP RONDONIA",wallets:[131,7002]},
  {id:"4004",prefix:"4004",name:"NOVA MAMORE",group:"SUP RONDONIA",wallets:[149,152,153,7002]},
  {id:"4007",prefix:"4007",name:"URUPA",group:"PRESIDENTE DUTRA",wallets:[129,7002]},
  {id:"4286",prefix:"4286",name:"AV BRASIL JI PARANA",group:"SUP RONDONIA",wallets:[94,96,97,105,7002]},
  {id:"7133",prefix:"7133",name:"CANDEIRAS DO JAMARI",group:"SUP RONDONIA",wallets:[44,45,7002]},
  {id:"8005",prefix:"8005",name:"SUP RONDONIA",group:"SUP RONDONIA",wallets:[7002]},
  {id:"8291",prefix:"8291",name:"CAMPO NOVO",group:"PRESIDENTE DUTRA",wallets:[7002]},
  {id:"8293",prefix:"8293",name:"PRESIDENTE MEDICI",group:"PRESIDENTE DUTRA",wallets:[130,154,7002]},
  {id:"3796",prefix:"3796",name:"GOV JORGE TEIXEIRA",group:"PRESIDENTE DUTRA",wallets:[39,7002]},
  {id:"3232",prefix:"3232",name:"CACOAL",group:"PRESIDENTE DUTRA",wallets:[7002]},
  {id:"9155",prefix:"9155",name:"ESC EXCLUSIVO",group:"ESC",wallets:[5,9,11,12,13,15,16,17,18,19,20,46,47]},
];
const GROUPS=["SUP RONDONIA","PRESIDENTE DUTRA","ESC"];
const ATT_TYPES=[
  {id:"normal",label:"Normal",short:"Normal",color:"#60a5fa",blocQual:false,blocVisit:false},
  {id:"qualificado",label:"Qualificado",short:"Qualificado",color:"#a78bfa",blocQual:true,blocVisit:false},
  {id:"rotacao",label:"Rotação de Carteiras",short:"Rotação",color:"#f59e0b",blocQual:true,blocVisit:false},
  {id:"qualificado_cotacao",label:"Qual. c/ Cotação",short:"c/ Cotação",color:"#f97316",blocQual:true,blocVisit:false},
  {id:"visita",label:"Visita Presencial",short:"Visita",color:"#22c55e",blocQual:false,blocVisit:true},
  {id:"visita_qualificado",label:"Visita + Qualificado",short:"Visita+Qual.",color:"#10b981",blocQual:true,blocVisit:true},
];
const SEM_QUAL_META=300,SEM_VISIT_META=28,MONTHLY_VISIT_META=5;
const pad=n=>String(n).padStart(2,"0");
const nowT=()=>{const d=new Date();return`${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const toISO=()=>new Date().toISOString().slice(0,10);
const toYM=iso=>iso.slice(0,7);
const fmtDate=iso=>{const[y,m,d]=iso.split("-");return`${d}/${m}/${y}`;};
const fmtYM=ym=>{const[y,m]=ym.split("-");const N=["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];return`${N[+m]}/${y}`;};
const TODAY=toISO(),CUR_YM=toYM(TODAY);
const WEEKDAY=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const C={bg:"#070d1a",panel:"rgba(255,255,255,0.045)",border:"rgba(255,255,255,0.08)",gold:"#f5c518",goldFade:"rgba(245,197,24,0.12)",text:"#e8f0fe",muted:"#7a8fa6",green:"#22c55e",orange:"#f97316",red:"#ef4444",blue:"#3b82f6",purple:"#a78bfa"};
const S={
  app:{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'Trebuchet MS','Segoe UI',sans-serif"},
  hdr:{background:"rgba(4,10,28,0.97)",borderBottom:`1px solid ${C.gold}55`,padding:"11px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:40,backdropFilter:"blur(14px)"},
  main:{maxWidth:700,margin:"0 auto",padding:"14px 13px 88px"},
  card:{background:C.panel,border:`1px solid ${C.border}`,borderRadius:13,padding:15,marginBottom:12},
  sec:{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:2.5,textTransform:"uppercase",marginBottom:10},
  lbl:{display:"block",fontSize:10,color:C.muted,letterSpacing:1.2,textTransform:"uppercase",marginBottom:5},
  inp:{width:"100%",background:"rgba(255,255,255,0.06)",border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 11px",color:C.text,fontSize:13,fontFamily:"inherit",boxSizing:"border-box",marginBottom:9,outline:"none"},
  txta:{width:"100%",background:"rgba(255,255,255,0.06)",border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 11px",color:C.text,fontSize:13,fontFamily:"inherit",boxSizing:"border-box",marginBottom:9,outline:"none",resize:"vertical",minHeight:60},
  btn:(bg,fg,p)=>({padding:p||"9px 15px",borderRadius:8,border:"none",cursor:"pointer",fontSize:13,fontWeight:700,background:bg,color:fg||"#fff",fontFamily:"inherit"}),
  chip:(color,on)=>({padding:"6px 11px",borderRadius:18,cursor:"pointer",fontSize:12,fontFamily:"inherit",border:`1px solid ${on?color:C.border}`,background:on?`${color}22`:"transparent",color:on?color:C.muted}),
  tab:on=>({flex:1,padding:"9px 4px",textAlign:"center",fontSize:11,fontWeight:700,color:on?C.gold:C.muted,borderBottom:on?`2px solid ${C.gold}`:"2px solid transparent",cursor:"pointer",background:"none",border:"none",fontFamily:"inherit"}),
  fab:{position:"fixed",bottom:20,right:16,width:52,height:52,borderRadius:26,background:C.gold,color:"#001f3f",fontSize:26,border:"none",cursor:"pointer",boxShadow:`0 4px 22px rgba(245,197,24,0.45)`,display:"flex",alignItems:"center",justifyContent:"center",zIndex:30},
};
function Bar({pct,color}){return(<div style={{height:5,borderRadius:3,background:"rgba(255,255,255,0.07)",overflow:"hidden",marginTop:5}}><div style={{height:"100%",width:`${Math.min(pct,100)}%`,background:color,borderRadius:3,transition:"width .7s"}}/></div>);}

// Tela de nome (primeira vez)
function NameSetup({onDone}){
  const[name,setName]=useState("");
  const[semQualDone,setSemQualDone]=useState("");
  const[semVisitDone,setSemVisitDone]=useState("");
  return(
    <div style={S.app}>
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:34,height:34,borderRadius:8,background:C.gold,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,color:"#001f3f",fontSize:11}}>FC</div>
          <div><div style={{fontSize:13,fontWeight:700,color:C.gold}}>FALA CONSULTOR</div><div style={{fontSize:9,color:C.muted,letterSpacing:2,textTransform:"uppercase"}}>BB Consórcio · RO</div></div>
        </div>
      </div>
      <div style={S.main}>
        <div style={{...S.card,border:`1px solid ${C.gold}44`,background:`rgba(245,197,24,0.04)`,marginTop:20}}>
          <div style={{fontSize:22,textAlign:"center",marginBottom:16}}>👋</div>
          <div style={S.sec}>Bem-vindo ao Fala Consultor!</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Informe seus dados para começar. Você só faz isso uma vez!</div>
          <label style={S.lbl}>Seu Nome</label>
          <input style={S.inp} placeholder="Ex: Wagner Pereira" value={name} onChange={e=>setName(e.target.value)}/>
          <label style={S.lbl}>Qualificados já realizados no semestre</label>
          <input type="number" style={S.inp} placeholder="Ex: 215" value={semQualDone} onChange={e=>setSemQualDone(e.target.value)}/>
          <label style={S.lbl}>Agências já visitadas no semestre</label>
          <input type="number" style={S.inp} placeholder="Ex: 18" value={semVisitDone} onChange={e=>setSemVisitDone(e.target.value)}/>
          <button style={{...S.btn(C.gold,"#001f3f"),width:"100%",padding:"13px",fontSize:14,marginTop:4}} onClick={()=>{if(name.trim())onDone({name:name.trim(),semQualDone:Number(semQualDone)||0,semVisitDone:Number(semVisitDone)||0});}}>
            ✓ Começar
          </button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const[profile,setProfile]=useState(()=>load("fc2_profile",null));
  const[atts,setAtts]=useState(()=>load("fc_atts",[]));
  const[pends,setPends]=useState(()=>load("fc_pend",[]));
  const[monthVisits,setMV]=useState(()=>load("fc_mv",{}));
  const[screen,setScreen]=useState("home");
  const[homeTab,setHomeTab]=useState("dash");
  const[selDate,setSelDate]=useState(TODAY);
  const[visitModal,setVisitModal]=useState(false);
  const[visitMonth,setVisitMonth]=useState(CUR_YM);
  const[walletAg,setWalletAg]=useState(null);
  const[editProfile,setEditProfile]=useState(false);

  const emptyForm={agencyId:"",type:"normal",manager:"",wallet:"",clientDoc:"",docType:"cpf",obs:"",hasPend:false,pendReturn:"",date:TODAY,time:nowT()};
  const[form,setForm]=useState(emptyForm);
  const[editId,setEditId]=useState(null);

  useEffect(()=>save("fc2_profile",profile),[profile]);
  useEffect(()=>save("fc_atts",atts),[atts]);
  useEffect(()=>save("fc_pend",pends),[pends]);
  useEffect(()=>save("fc_mv",monthVisits),[monthVisits]);

  if(!profile||editProfile) return <NameSetup onDone={p=>{setProfile(p);setEditProfile(false);}}/>;

  const SEM_QUAL_DONE_BASE=profile.semQualDone||0;
  const SEM_VISIT_DONE_BASE=profile.semVisitDone||0;

  const todayAtts=atts.filter(a=>a.date===TODAY);
  const appQual=atts.filter(a=>ATT_TYPES.find(t=>t.id===a.type)?.blocQual).length;
  const totalQual=SEM_QUAL_DONE_BASE+appQual;
  const qualPct=Math.round((totalQual/SEM_QUAL_META)*100);

  const allVisitedSem=new Set(AGENCIES.slice(0,SEM_VISIT_DONE_BASE).map(a=>a.id));
  Object.values(monthVisits).forEach(mv=>Object.keys(mv).forEach(id=>{if(mv[id]>0)allVisitedSem.add(id);}));
  const totalVisitSem=allVisitedSem.size;
  const visitSemPct=Math.round((totalVisitSem/SEM_VISIT_META)*100);

  const mvCur=monthVisits[CUR_YM]||{};
  const monthVisitCount=Object.values(mvCur).reduce((a,b)=>a+b,0);
  const monthVisitPct=Math.round((monthVisitCount/MONTHLY_VISIT_META)*100);
  const openPend=pends.filter(p=>!p.done);
  const allMonths=[...new Set([CUR_YM,...Object.keys(monthVisits)])].sort((a,b)=>b.localeCompare(a));
  const semMonths=["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06"];

  const getAttendedWallets=agId=>[...new Set(atts.filter(a=>a.agencyId===agId&&a.wallet).map(a=>String(a.wallet)))];
  const markVisit=(agId,ym)=>setMV(p=>{const mo={...(p[ym]||{})};mo[agId]=(mo[agId]||0)+1;return{...p,[ym]:mo};});
  const unmarkVisit=(agId,ym)=>setMV(p=>{const mo={...(p[ym]||{})};if(mo[agId]>0)mo[agId]--;return{...p,[ym]:mo};});

  function saveAtt(){
    if(!form.agencyId||!form.type)return;
    const rec={...form,id:editId||Date.now()};
    if(editId){setAtts(a=>a.map(x=>x.id===editId?rec:x));setEditId(null);}
    else{setAtts(a=>[rec,...a]);}
    if(form.hasPend&&form.obs){const ag=AGENCIES.find(x=>x.id===form.agencyId);setPends(p=>[...p,{id:Date.now()+1,agencyId:form.agencyId,agName:ag?`${ag.prefix} — ${ag.name}`:"",manager:form.manager,wallet:form.wallet,clientDoc:form.clientDoc,docType:form.docType,desc:form.obs,returnDate:form.pendReturn,done:false,createdAt:TODAY}]);}
    setForm(emptyForm);setScreen("home");
  }
  const deleteAtt=id=>setAtts(a=>a.filter(x=>x.id!==id));
  const togglePend=id=>setPends(p=>p.map(x=>x.id===id?{...x,done:!x.done}:x));
  const deletePend=id=>setPends(p=>p.filter(x=>x.id!==id));

  function buildReport(date){
    const list=atts.filter(a=>a.date===date);
    if(!list.length)return`📋 RELATÓRIO FALA CONSULTOR — ${fmtDate(date)}\nConsultor: ${profile.name}\n\nNenhum atendimento registrado.`;
    const lines=[`📋 RELATÓRIO FALA CONSULTOR — ${fmtDate(date)}`,`Consultor: ${profile.name}`,""];
    const byAg={};
    list.forEach(a=>{const ag=AGENCIES.find(x=>x.id===a.agencyId);const k=ag?`${ag.prefix} — ${ag.name}`:"—";if(!byAg[k])byAg[k]=[];byAg[k].push(a);});
    Object.entries(byAg).forEach(([ag,ls])=>{lines.push(`🏦 ${ag}`);ls.forEach(a=>{const t=ATT_TYPES.find(x=>x.id===a.type);let ln=`  • [${a.time}] ${t?.label||a.type}`;if(a.manager)ln+=` — ${a.manager}`;if(a.wallet)ln+=` (Cart.${a.wallet})`;if(a.clientDoc)ln+=` | ${a.docType?.toUpperCase()}: ${a.clientDoc}`;if(a.obs)ln+=`\n    📝 ${a.obs}`;if(a.hasPend)ln+=`\n    ⏳ Retorno: ${a.pendReturn?fmtDate(a.pendReturn):"a combinar"}`;lines.push(ln);});lines.push("");});
    const q=list.filter(a=>ATT_TYPES.find(t=>t.id===a.type)?.blocQual).length;
    const v=list.filter(a=>ATT_TYPES.find(t=>t.id===a.type)?.blocVisit).length;
    lines.push(`─────────────────`);lines.push(`Total: ${list.length} | Qualificados: ${q} | Visitas: ${v}`);
    return lines.join("\n");
  }

  if(screen==="home")return(
    <div style={S.app}>
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:34,height:34,borderRadius:8,background:C.gold,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,color:"#001f3f",fontSize:11}}>FC</div>
          <div><div style={{fontSize:13,fontWeight:700,color:C.gold}}>FALA CONSULTOR</div><div style={{fontSize:9,color:C.muted,letterSpacing:2,textTransform:"uppercase"}}>{profile.name}</div></div>
        </div>
        <div style={{display:"flex",gap:7}}>
          <button style={S.btn("rgba(255,255,255,0.07)",C.muted,"6px 11px")} onClick={()=>setScreen("report")}>Relatório</button>
          <button style={S.btn(C.goldFade,C.gold,"6px 11px")} onClick={()=>{setVisitModal(true);setVisitMonth(CUR_YM);}}>📍 Visitas</button>
          <button style={S.btn("rgba(255,255,255,0.07)",C.muted,"6px 11px")} onClick={()=>setEditProfile(true)}>⚙️</button>
        </div>
      </div>
      <div style={S.main}>
        <div style={{fontSize:11,color:C.muted,marginBottom:12,textTransform:"capitalize"}}>📅 {WEEKDAY}</div>
        <div style={{display:"flex",borderBottom:`1px solid ${C.border}`,marginBottom:13}}>
          {[["dash","Dashboard"],["hoje","Hoje"],["mensal","Mensal"],["carteiras","Carteiras"],["pend","Pendências"]].map(([k,l])=>(
            <button key={k} style={S.tab(homeTab===k)} onClick={()=>setHomeTab(k)}>
              {l}{k==="pend"&&openPend.length>0&&<span style={{marginLeft:3,background:C.orange,color:"#fff",borderRadius:9,padding:"1px 5px",fontSize:9}}>{openPend.length}</span>}
            </button>
          ))}
        </div>

        {homeTab==="dash"&&<>
          <div style={S.card}>
            <div style={S.sec}>Metas Semestrais — Jan/Jun 2026</div>
            <div style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12}}>Atend. Qualificados</span><span style={{fontSize:11,color:C.muted}}>{totalQual}/{SEM_QUAL_META} · {qualPct}%</span></div>
              <Bar pct={qualPct} color={qualPct>=72?C.green:C.orange}/>
              <div style={{fontSize:10,color:C.muted,marginTop:3}}>Faltam <b style={{color:C.gold}}>{Math.max(0,SEM_QUAL_META-totalQual)}</b> qualificados</div>
            </div>
            <div>
              <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12}}>Prefixos Visitados</span><span style={{fontSize:11,color:C.muted}}>{totalVisitSem}/{SEM_VISIT_META} · {visitSemPct}%</span></div>
              <Bar pct={visitSemPct} color={visitSemPct>=90?C.green:C.orange}/>
              <div style={{fontSize:10,color:C.muted,marginTop:3}}>Faltam <b style={{color:C.gold}}>{Math.max(0,SEM_VISIT_META-totalVisitSem)}</b> agências</div>
            </div>
          </div>
          <div style={S.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:2,textTransform:"uppercase"}}>Visitas — {fmtYM(CUR_YM)}</div>
              <button style={S.btn(C.goldFade,C.gold,"5px 11px")} onClick={()=>{setVisitModal(true);setVisitMonth(CUR_YM);}}>Marcar Visita</button>
            </div>
            <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12}}>Visitas no mês</span><span style={{fontSize:11,color:C.muted}}>{monthVisitCount}/{MONTHLY_VISIT_META} · {monthVisitPct}%</span></div>
            <Bar pct={monthVisitPct} color={monthVisitPct>=100?C.green:C.orange}/>
            <div style={{fontSize:10,color:C.muted,marginTop:3}}>Faltam <b style={{color:C.gold}}>{Math.max(0,MONTHLY_VISIT_META-monthVisitCount)}</b> visitas este mês</div>
          </div>
          <div style={S.card}>
            <div style={S.sec}>Mapa de Agências</div>
            {GROUPS.map(grp=>(
              <div key={grp} style={{marginBottom:12}}>
                <div style={{fontSize:9,color:C.muted,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>{grp}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                  {AGENCIES.filter(a=>a.group===grp).map(ag=>{
                    const visited=allVisitedSem.has(ag.id);
                    const mvCount=(monthVisits[CUR_YM]||{})[ag.id]||0;
                    const attW=getAttendedWallets(ag.id);
                    return(<div key={ag.id} onClick={()=>setWalletAg(ag)} style={{background:visited?"rgba(34,197,94,0.09)":"rgba(255,255,255,0.03)",border:`1px solid ${visited?"#22c55e44":C.border}`,borderRadius:8,padding:"8px 10px",cursor:"pointer"}}>
                      <div style={{display:"flex",justifyContent:"space-between"}}><div style={{fontSize:12,fontWeight:700,color:visited?C.green:C.text}}>{ag.prefix}</div>{ag.wallets.length>1&&<div style={{fontSize:9,color:C.muted}}>{attW.length}/{ag.wallets.length}</div>}</div>
                      <div style={{fontSize:10,color:C.muted}}>{ag.name}</div>
                      <div style={{fontSize:9,marginTop:2,color:visited?C.green:C.orange}}>{visited?"✓ Visitada":"○ Pendente"}{mvCount>0&&<span style={{color:C.blue,marginLeft:4}}>·{mvCount}x mês</span>}</div>
                    </div>);
                  })}
                </div>
              </div>
            ))}
          </div>
        </>}

        {homeTab==="hoje"&&<>
          <div style={{display:"flex",gap:9,marginBottom:12}}>
            {[[todayAtts.length,"Atendimentos",C.blue],[todayAtts.filter(a=>ATT_TYPES.find(t=>t.id===a.type)?.blocQual).length,"Qualificados",C.purple],[todayAtts.filter(a=>ATT_TYPES.find(t=>t.id===a.type)?.blocVisit).length,"Visitas",C.green]].map(([n,l,c])=>(
              <div key={l} style={{flex:1,background:`${c}12`,border:`1px solid ${c}33`,borderRadius:11,padding:"11px 8px",textAlign:"center"}}>
                <div style={{fontSize:24,fontWeight:900,color:c,lineHeight:1}}>{n}</div>
                <div style={{fontSize:9,color:C.muted,marginTop:3,textTransform:"uppercase"}}>{l}</div>
              </div>
            ))}
          </div>
          {todayAtts.length===0&&<div style={{...S.card,textAlign:"center",padding:32}}><div style={{fontSize:32,marginBottom:8}}>📋</div><div style={{color:C.muted,fontSize:13}}>Nenhum atendimento hoje ainda.</div><div style={{color:C.muted,fontSize:11,marginTop:4}}>Toque em + para registrar.</div></div>}
          {todayAtts.map(a=>{const ag=AGENCIES.find(x=>x.id===a.agencyId);const t=ATT_TYPES.find(x=>x.id===a.type)||ATT_TYPES[0];return(
            <div key={a.id} style={{background:`${t.color}0d`,border:`1px solid ${t.color}33`,borderRadius:10,padding:12,marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between"}}><div><span style={{fontSize:12,fontWeight:700,color:t.color}}>{t.short}</span><span style={{fontSize:11,color:C.muted,marginLeft:8}}>{a.time}</span></div><button style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:15}} onClick={()=>deleteAtt(a.id)}>✕</button></div>
              <div style={{fontSize:13,marginTop:4}}>🏦 {ag?`${ag.prefix} — ${ag.name}`:"—"}</div>
              {a.manager&&<div style={{fontSize:11,color:C.muted}}>👤 {a.manager}{a.wallet?` · Cart.${a.wallet}`:""}</div>}
              {a.clientDoc&&<div style={{fontSize:11,color:C.muted}}>🪪 {a.docType?.toUpperCase()}: {a.clientDoc}</div>}
              {a.obs&&<div style={{fontSize:11,color:C.muted,marginTop:3}}>📝 {a.obs}</div>}
              {a.hasPend&&<div style={{fontSize:11,color:C.orange,marginTop:3}}>⏳ Retorno: {a.pendReturn?fmtDate(a.pendReturn):"a combinar"}</div>}
            </div>
          );})}
        </>}

        {homeTab==="mensal"&&<>
          {allMonths.map(ym=>{const mv=monthVisits[ym]||{};const total=Object.values(mv).reduce((a,b)=>a+b,0);const uniqueV=Object.keys(mv).filter(id=>mv[id]>0);const attsM=atts.filter(a=>toYM(a.date)===ym);const qualM=attsM.filter(a=>ATT_TYPES.find(t=>t.id===a.type)?.blocQual).length;return(
            <div key={ym} style={S.card}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontSize:14,fontWeight:700,color:C.gold}}>{fmtYM(ym)}</div><button style={S.btn(C.goldFade,C.gold,"5px 10px")} onClick={()=>{setVisitModal(true);setVisitMonth(ym);}}>+ Marcar</button></div>
              <div style={{display:"flex",gap:9,marginBottom:10}}>{[[total,"Visitas",C.green],[qualM,"Qualificados",C.purple],[attsM.length,"Atendimentos",C.blue]].map(([n,l,c])=>(<div key={l} style={{flex:1,background:`${c}10`,border:`1px solid ${c}30`,borderRadius:9,padding:"9px 6px",textAlign:"center"}}><div style={{fontSize:20,fontWeight:900,color:c}}>{n}</div><div style={{fontSize:9,color:C.muted,textTransform:"uppercase"}}>{l}</div></div>))}</div>
              {uniqueV.length>0&&<div style={{fontSize:11,color:C.muted,marginBottom:6}}>{uniqueV.map(id=>{const ag=AGENCIES.find(a=>a.id===id);return ag?`${ag.prefix}${mv[id]>1?` (${mv[id]}x)`:""}`:id;}).join(" · ")}</div>}
              <Bar pct={Math.round((total/MONTHLY_VISIT_META)*100)} color={total>=MONTHLY_VISIT_META?C.green:C.orange}/>
              <div style={{fontSize:10,color:C.muted,marginTop:3}}>Meta: {MONTHLY_VISIT_META} visitas/mês</div>
            </div>
          );})}
          {allMonths.length===0&&<div style={{...S.card,textAlign:"center",padding:28,color:C.muted,fontSize:13}}>Nenhum registro ainda.</div>}
        </>}

        {homeTab==="carteiras"&&<>
          {AGENCIES.map(ag=>{const attW=getAttendedWallets(ag.id);const pct=ag.wallets.length>0?Math.round((attW.length/ag.wallets.length)*100):0;return(
            <div key={ag.id} style={{...S.card,marginBottom:9}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><div><span style={{fontWeight:700,color:C.gold,fontSize:13}}>{ag.prefix}</span><span style={{color:C.muted,fontSize:11,marginLeft:7}}>{ag.name}</span></div><span style={{fontSize:11,color:attW.length===ag.wallets.length?C.green:C.muted}}>{attW.length}/{ag.wallets.length}</span></div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{ag.wallets.map(w=>{const done=attW.includes(String(w));return(<span key={w} style={{padding:"3px 10px",borderRadius:14,fontSize:11,fontWeight:600,background:done?"rgba(34,197,94,0.15)":"rgba(255,255,255,0.05)",border:`1px solid ${done?"#22c55e55":C.border}`,color:done?C.green:C.muted}}>{done?"✓ ":""}{w}</span>);})}</div>
              {ag.wallets.length>1&&<Bar pct={pct} color={pct===100?C.green:C.orange}/>}
            </div>
          );})}
        </>}

        {homeTab==="pend"&&<>
          {openPend.length===0&&<div style={{...S.card,textAlign:"center",padding:28,color:C.muted,fontSize:13}}>✅ Sem pendências em aberto!</div>}
          {pends.map(p=>(
            <div key={p.id} style={{background:p.done?"rgba(255,255,255,0.02)":"rgba(249,115,22,0.07)",border:`1px solid ${p.done?C.border:"#f9731633"}`,borderRadius:10,padding:12,marginBottom:8,opacity:p.done?.55:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div style={{fontSize:12,fontWeight:700,color:p.done?C.muted:C.orange}}>{p.agName}</div><div style={{display:"flex",gap:6}}><button style={S.btn("rgba(34,197,94,0.15)",C.green,"4px 9px")} onClick={()=>togglePend(p.id)}>{p.done?"↩":"✓"}</button><button style={S.btn("rgba(239,68,68,0.12)",C.red,"4px 9px")} onClick={()=>deletePend(p.id)}>✕</button></div></div>
              {p.manager&&<div style={{fontSize:11,color:C.muted}}>👤 {p.manager}{p.wallet?` · Cart.${p.wallet}`:""}</div>}
              {p.clientDoc&&<div style={{fontSize:11,color:C.muted}}>🪪 {p.docType?.toUpperCase()}: {p.clientDoc}</div>}
              <div style={{fontSize:12,marginTop:4}}>📝 {p.desc}</div>
              {p.returnDate&&<div style={{fontSize:11,color:C.orange,marginTop:3}}>📅 Retorno: {fmtDate(p.returnDate)}</div>}
              <div style={{fontSize:10,color:C.muted,marginTop:3}}>Criada em {fmtDate(p.createdAt)}</div>
            </div>
          ))}
        </>}
      </div>

      <button style={S.fab} onClick={()=>{setForm(emptyForm);setEditId(null);setScreen("register");}}>+</button>

      {visitModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:50,display:"flex",flexDirection:"column"}} onClick={e=>{if(e.target===e.currentTarget)setVisitModal(false);}}>
          <div style={{background:"#0d1630",borderTop:`2px solid ${C.gold}`,borderRadius:"16px 16px 0 0",position:"absolute",bottom:0,left:0,right:0,maxHeight:"85vh",display:"flex",flexDirection:"column"}}>
            <div style={{padding:"13px 15px 10px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:13,fontWeight:700,color:C.gold}}>Marcar Visitas</div><div style={{fontSize:10,color:C.muted,marginTop:2}}>Toque + para adicionar · − para remover</div></div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <select style={{...S.inp,marginBottom:0,width:"auto",fontSize:12,padding:"5px 9px"}} value={visitMonth} onChange={e=>setVisitMonth(e.target.value)}>
                  {semMonths.map(ym=><option key={ym} value={ym}>{fmtYM(ym)}{ym===CUR_YM?" ★":""}</option>)}
                </select>
                <button style={S.btn("rgba(255,255,255,0.07)",C.muted,"6px 11px")} onClick={()=>setVisitModal(false)}>✕</button>
              </div>
            </div>
            <div style={{overflowY:"auto",padding:"12px 14px 20px"}}>
              {(()=>{const mv=monthVisits[visitMonth]||{};const total=Object.values(mv).reduce((a,b)=>a+b,0);return(<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.goldFade,borderRadius:9,padding:"9px 13px",marginBottom:12}}><span style={{fontSize:12,color:C.gold}}>Visitas em {fmtYM(visitMonth)}</span><span style={{fontSize:18,fontWeight:900,color:C.gold}}>{total} <span style={{fontSize:11,color:C.muted}}>/ {MONTHLY_VISIT_META}</span></span></div>);})()}
              {GROUPS.map(grp=>(
                <div key={grp} style={{marginBottom:14}}>
                  <div style={{fontSize:9,color:C.muted,letterSpacing:1.5,textTransform:"uppercase",marginBottom:7}}>{grp}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
                    {AGENCIES.filter(a=>a.group===grp).map(ag=>{
                      const count=(monthVisits[visitMonth]||{})[ag.id]||0;
                      const semVisited=allVisitedSem.has(ag.id);
                      return(<div key={ag.id} style={{background:count>0?"rgba(34,197,94,0.12)":"rgba(255,255,255,0.04)",border:`1px solid ${count>0?"#22c55e55":C.border}`,borderRadius:10,padding:"10px 11px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                          <div style={{fontSize:12,fontWeight:700,color:count>0?C.green:C.text}}>{ag.prefix}</div>
                          {count>0&&<div style={{display:"flex",gap:5,alignItems:"center"}}><button onClick={()=>unmarkVisit(ag.id,visitMonth)} style={{background:"rgba(239,68,68,0.2)",border:"none",color:C.red,borderRadius:6,padding:"1px 7px",fontSize:13,cursor:"pointer",fontWeight:700}}>−</button><span style={{background:C.green,color:"#fff",borderRadius:12,padding:"1px 7px",fontSize:11,fontWeight:700}}>{count}x</span><button onClick={()=>markVisit(ag.id,visitMonth)} style={{background:"rgba(34,197,94,0.2)",border:"none",color:C.green,borderRadius:6,padding:"1px 7px",fontSize:13,cursor:"pointer",fontWeight:700}}>+</button></div>}
                        </div>
                        <div style={{fontSize:10,color:C.muted,marginTop:2}}>{ag.name}</div>
                        <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
                          <div style={{fontSize:9,color:semVisited?C.green:C.muted}}>{semVisited?"✓ semestre":"○ semestre"}</div>
                          {count===0&&<button onClick={()=>markVisit(ag.id,visitMonth)} style={{background:C.goldFade,border:`1px solid ${C.gold}44`,color:C.gold,borderRadius:6,padding:"2px 10px",fontSize:10,cursor:"pointer",fontWeight:700}}>+ Visita</button>}
                        </div>
                      </div>);
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {walletAg&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>{if(e.target===e.currentTarget)setWalletAg(null);}}>
          <div style={{background:"#0d1630",border:`1px solid ${C.gold}55`,borderRadius:16,padding:20,width:"100%",maxWidth:400}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}><div><div style={{fontSize:15,fontWeight:700,color:C.gold}}>{walletAg.prefix} — {walletAg.name}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>Carteiras desta agência</div></div><button style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:18}} onClick={()=>setWalletAg(null)}>✕</button></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{walletAg.wallets.map(w=>{const done=getAttendedWallets(walletAg.id).includes(String(w));return(<div key={w} style={{padding:"8px 14px",borderRadius:10,fontSize:13,fontWeight:700,background:done?"rgba(34,197,94,0.15)":"rgba(255,255,255,0.05)",border:`1px solid ${done?"#22c55e55":C.border}`,color:done?C.green:C.muted}}>{done?"✓ ":""}{w}</div>);})}</div>
          </div>
        </div>
      )}
    </div>
  );

  if(screen==="register"){
    const needWallet=form.type!=="normal"&&form.type!=="visita";
    const selAg=AGENCIES.find(a=>a.id===form.agencyId);
    return(
      <div style={S.app}>
        <div style={S.hdr}><button style={S.btn("rgba(255,255,255,0.07)",C.muted,"6px 11px")} onClick={()=>setScreen("home")}>← Voltar</button><span style={{fontSize:13,fontWeight:700,color:C.gold}}>Registrar Atendimento</span><button style={S.btn(C.gold,"#001f3f","6px 13px")} onClick={saveAtt}>Salvar</button></div>
        <div style={S.main}>
          <div style={S.card}>
            <div style={{display:"flex",gap:9,marginBottom:9}}>
              <div style={{flex:1}}><label style={S.lbl}>Data</label><input type="date" style={S.inp} value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
              <div style={{flex:1}}><label style={S.lbl}>Horário</label><input type="time" style={S.inp} value={form.time} onChange={e=>setForm(f=>({...f,time:e.target.value}))}/></div>
            </div>
            <label style={S.lbl}>Prefixo / Agência</label>
            <select style={S.inp} value={form.agencyId} onChange={e=>setForm(f=>({...f,agencyId:e.target.value,wallet:""}))}>
              <option value="">Selecione...</option>
              {GROUPS.map(grp=>(<optgroup key={grp} label={grp}>{AGENCIES.filter(a=>a.group===grp).map(a=>(<option key={a.id} value={a.id}>{a.prefix} — {a.name}</option>))}</optgroup>))}
            </select>
            <label style={S.lbl}>Tipo de Atendimento</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:11}}>{ATT_TYPES.map(t=>(<button key={t.id} style={S.chip(t.color,form.type===t.id)} onClick={()=>setForm(f=>({...f,type:t.id}))}>{t.short}</button>))}</div>
            {needWallet&&<>
              <label style={S.lbl}>Gerente</label>
              <input style={S.inp} placeholder="Nome do gerente" value={form.manager} onChange={e=>setForm(f=>({...f,manager:e.target.value}))}/>
              <label style={S.lbl}>Carteira</label>
              {selAg&&selAg.wallets.length>1?(<div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:10}}>{selAg.wallets.map(w=>(<button key={w} style={S.chip(C.blue,form.wallet===String(w))} onClick={()=>setForm(f=>({...f,wallet:String(w)}))}>{w}</button>))}</div>):(<input style={S.inp} placeholder="Número da carteira" value={form.wallet} onChange={e=>setForm(f=>({...f,wallet:e.target.value}))}/>)}
            </>}
            <label style={S.lbl}>Identificação do Cliente (opcional)</label>
            <div style={{display:"flex",gap:8,marginBottom:9}}>{["cpf","cnpj","mci"].map(tp=>(<button key={tp} style={{...S.chip(C.blue,form.docType===tp),flex:1,textAlign:"center"}} onClick={()=>setForm(f=>({...f,docType:tp}))}>{tp.toUpperCase()}</button>))}</div>
            <input style={S.inp} placeholder={form.docType==="cpf"?"000.000.000-00":form.docType==="cnpj"?"00.000.000/0000-00":"Número MCI"} value={form.clientDoc} onChange={e=>setForm(f=>({...f,clientDoc:e.target.value}))}/>
            <label style={S.lbl}>Assunto / Observações</label>
            <textarea style={S.txta} placeholder="Produto discutido, situação, próximos passos..." value={form.obs} onChange={e=>setForm(f=>({...f,obs:e.target.value}))}/>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:form.hasPend?10:0}}>
              <input type="checkbox" id="hp" checked={form.hasPend} onChange={e=>setForm(f=>({...f,hasPend:e.target.checked}))} style={{width:16,height:16,cursor:"pointer"}}/>
              <label htmlFor="hp" style={{fontSize:12,color:C.orange,cursor:"pointer"}}>⏳ Ficou pendente / precisa de retorno</label>
            </div>
            {form.hasPend&&<><label style={S.lbl}>Data de Retorno</label><input type="date" style={S.inp} value={form.pendReturn} onChange={e=>setForm(f=>({...f,pendReturn:e.target.value}))}/></>}
          </div>
        </div>
      </div>
    );
  }

  if(screen==="report"){
    const dates=[...new Set(atts.map(a=>a.date))].sort((a,b)=>b.localeCompare(a));
    const txt=buildReport(selDate);
    return(
      <div style={S.app}>
        <div style={S.hdr}><button style={S.btn("rgba(255,255,255,0.07)",C.muted,"6px 11px")} onClick={()=>setScreen("home")}>← Voltar</button><span style={{fontSize:13,fontWeight:700,color:C.gold}}>Relatório Diário</span><button style={S.btn(C.gold,"#001f3f","6px 12px")} onClick={()=>navigator.clipboard?.writeText(txt).then(()=>alert("Copiado!"))}>Copiar</button></div>
        <div style={S.main}>
          <label style={S.lbl}>Data</label>
          <select style={S.inp} value={selDate} onChange={e=>setSelDate(e.target.value)}>{[TODAY,...dates.filter(d=>d!==TODAY)].map(d=>(<option key={d} value={d}>{fmtDate(d)}{d===TODAY?" (Hoje)":""}</option>))}</select>
          <div style={{background:"#fff",color:"#111",borderRadius:11,padding:18,fontFamily:"monospace",fontSize:12.5,lineHeight:1.75,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{txt}</div>
          <div style={{fontSize:10,color:C.muted,textAlign:"center",marginTop:10}}>Copie e cole no WhatsApp, e-mail ou sistema de lançamento</div>
        </div>
      </div>
    );
  }
  return null;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
