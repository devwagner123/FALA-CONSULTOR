// ── FIRST TIME AGENCY SETUP ────────────────────────────────────────────────
function AgencySetupFirst({onDone}){
  const[ags,setAgs]=useState([{prefix:"",name:"",group:"SUP RONDONIA"}]);
  function addAg(){setAgs(a=>[...a,{prefix:"",name:"",group:"SUP RONDONIA"}]);}
  function removeAg(i){setAgs(a=>a.filter((_,idx)=>idx!==i));}
  function updateAg(i,f,v){setAgs(a=>a.map((x,idx)=>idx===i?{...x,[f]:v}:x));}
  function finish(){
    const valid=ags.filter(a=>a.prefix.trim()&&a.name.trim());
    if(valid.length===0) return;
    onDone(valid.map((a,i)=>({id:String(Date.now()+i),prefix:a.prefix.trim(),name:a.name.trim(),group:a.group,wallets:[7002]})));
  }
  return(
    <div style={S.app}>
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:34,height:34,borderRadius:8,background:C.gold,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,color:"#001f3f",fontSize:11}}>FC</div>
          <div><div style={{fontSize:13,fontWeight:700,color:C.gold}}>FALA CONSULTOR</div><div style={{fontSize:9,color:C.muted,letterSpacing:2,textTransform:"uppercase"}}>Suas Agências</div></div>
        </div>
        <button style={{...S.btn(C.gold,"#001f3f","7px 14px")}} onClick={finish}>Começar →</button>
      </div>
      <div style={S.main}>
        <div style={{...S.card,background:`rgba(245,197,24,0.05)`,border:`1px solid ${C.gold}44`,marginBottom:16}}>
          <div style={{fontSize:13,color:C.gold,fontWeight:700,marginBottom:6}}>👋 Bem-vindo!</div>
          <div style={{fontSize:12,color:C.muted}}>Cadastre as agências da sua área. Você pode adicionar mais depois em ⚙️.</div>
        </div>
        {ags.map((ag,i)=>(
          <div key={i} style={{...S.card,marginBottom:9}}>
            <div style={{display:"flex",gap:8,marginBottom:8}}>
              <div style={{flex:"0 0 85px"}}>
                <label style={S.lbl}>Prefixo</label>
                <input style={{...S.inp,marginBottom:0}} placeholder="Ex: 102" value={ag.prefix} onChange={e=>updateAg(i,"prefix",e.target.value)}/>
              </div>
              <div style={{flex:1}}>
                <label style={S.lbl}>Nome</label>
                <input style={{...S.inp,marginBottom:0}} placeholder="Ex: PORTO VELHO" value={ag.name} onChange={e=>updateAg(i,"name",e.target.value)}/>
              </div>
              {ags.length>1&&<button style={{...S.btn("rgba(239,68,68,0.15)",C.red,"6px 10px"),alignSelf:"flex-end"}} onClick={()=>removeAg(i)}>✕</button>}
            </div>
            <label style={S.lbl}>Grupo</label>
            <div style={{display:"flex",gap:6}}>
              {["SUP RONDONIA","PRESIDENTE DUTRA","ESC","OUTRO"].map(g=>(
                <button key={g} style={{...S.chip(C.gold,ag.group===g),flex:1,textAlign:"center",fontSize:10,padding:"5px 4px"}} onClick={()=>updateAg(i,"group",g)}>{g.split(" ")[0]}</button>
              ))}
            </div>
          </div>
        ))}
        <button style={{...S.btn("rgba(255,255,255,0.07)",C.muted),width:"100%",padding:"10px",fontSize:13,marginBottom:12}} onClick={addAg}>
          + Adicionar Agência
        </button>
        <button style={{...S.btn(C.gold,"#001f3f"),width:"100%",padding:"13px",fontSize:14}} onClick={finish}>
          ✓ Salvar e Começar
        </button>
      </div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────────────────
function App(){
  const[userName,setUserName]=useState(()=>load("fc_name",""));
  const[loggedIn,setLoggedIn]=useState(()=>!!load("fc_name",""));
  const[agencies,setAgencies]=useState(()=>load("fc_agencies",null));
  const[agSelected,setAgSelected]=useState(()=>!!load("fc_agencies",null));
  const[atts,setAtts]=useState(()=>load("fc_atts",[]));
  const[pends,setPends]=useState(()=>load("fc_pend",[]));
  const[monthVisits,setMV]=useState(()=>load("fc_mv",{}));
  const[screen,setScreen]=useState("home");
  const[homeTab,setHomeTab]=useState("mensal");
  const[selDate,setSelDate]=useState(TODAY);
  const[visitModal,setVisitModal]=useState(false);
  const[visitMonth,setVisitMonth]=useState(CUR_YM);
  const[settingsModal,setSettingsModal]=useState(false);
  const[editNameVal,setEditNameVal]=useState("");
  const[agenciesModal,setAgenciesModal]=useState(false);
  const[editingAg,setEditingAg]=useState(null);
  const[agForm,setAgForm]=useState({prefix:"",name:"",group:"SUP RONDONIA"});
  const[aiText,setAiText]=useState("");
  const[aiLoading,setAiLoading]=useState(false);
  const[aiResult,setAiResult]=useState(null);

  const emptyForm={agencyId:"",type:"normal",manager:"",wallet:"",clientDoc:"",docType:"cpf",obs:"",hasPend:false,pendReturn:"",date:TODAY,time:nowT()};
  const[form,setForm]=useState(emptyForm);
  const[editId,setEditId]=useState(null);

  useEffect(()=>save("fc_name",userName),[userName]);
  useEffect(()=>{ if(agencies!==null) save("fc_agencies",agencies); },[agencies]);
  useEffect(()=>save("fc_atts",atts),[atts]);
  useEffect(()=>save("fc_pend",pends),[pends]);
  useEffect(()=>save("fc_mv",monthVisits),[monthVisits]);

  const AG = agencies || [];

  if(!loggedIn) return <Login savedName={userName} onEnter={n=>{setUserName(n);setLoggedIn(true);}}/>;

  // First time — no agencies configured yet
  if(agencies===null) return <AgencySetupFirst onDone={ags=>{setAgencies(ags);}}/>;

  function saveAgency(){
    if(!agForm.prefix.trim()||!agForm.name.trim()) return;
    if(editingAg){
      setAgencies(AG.map(a=>a.id===editingAg?{...a,prefix:agForm.prefix.trim(),name:agForm.name.trim(),group:agForm.group}:a));
      setEditingAg(null);
    } else {
      const newId=String(Date.now());
      setAgencies([...AG,{id:newId,prefix:agForm.prefix.trim(),name:agForm.name.trim(),group:agForm.group,wallets:[7002]}]);
    }
    setAgForm({prefix:"",name:"",group:"SUP RONDONIA"});
  }
  function deleteAgency(id){ setAgencies(AG.filter(a=>a.id!==id)); }
  function startEditAg(ag){ setEditingAg(ag.id); setAgForm({prefix:ag.prefix,name:ag.name,group:ag.group}); }
  // ── Derived ──────────────────────────────────────────────────────────
  const todayAtts=atts.filter(a=>a.date===TODAY);
  const appQual=atts.filter(a=>ATT_TYPES.find(t=>t.id===a.type)?.blocQual).length;
  const totalQual=SEM_QUAL_DONE_BASE+appQual;
  const qualSemPct=Math.round((totalQual/SEM_QUAL_META)*100);

  // Semestral visits — unique agencies
  const allVisitedSem=new Set(AG.slice(0,SEM_VISIT_DONE_BASE).map(a=>a.id));
  Object.values(monthVisits).forEach(mv=>Object.keys(mv).forEach(id=>{if(mv[id]>0)allVisitedSem.add(id);}));
  const totalVisitSem=allVisitedSem.size;
  const visitSemPct=Math.round((totalVisitSem/SEM_VISIT_META)*100);

  // Monthly visits
  const mvCur=monthVisits[CUR_YM]||{};
  const monthVisitCount=Object.values(mvCur).reduce((a,b)=>a+b,0);
  const monthVisitPct=Math.round((monthVisitCount/MONTHLY_VISIT_META)*100);

  // Monthly qual
  const attsThisMonth=atts.filter(a=>toYM(a.date)===CUR_YM);
  const qualThisMonth=attsThisMonth.filter(a=>ATT_TYPES.find(t=>t.id===a.type)?.blocQual).length;
  const qualMonthPct=Math.round((qualThisMonth/MONTHLY_QUAL_META)*100);

  const openPend=pends.filter(p=>!p.done);
  const allMonths=[...new Set([CUR_YM,...Object.keys(monthVisits),...[...new Set(atts.map(a=>toYM(a.date)))]])].sort((a,b)=>b.localeCompare(a));
  const semMonths=["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06"];

  const markVisit=(agId,ym)=>setMV(p=>{const mo={...(p[ym]||{})};mo[agId]=(mo[agId]||0)+1;return{...p,[ym]:mo};});
  const unmarkVisit=(agId,ym)=>setMV(p=>{const mo={...(p[ym]||{})};if(mo[agId]>0)mo[agId]--;return{...p,[ym]:mo};});

  async function runAI(){
    if(!aiText.trim()) return;
    setAiLoading(true); setAiResult(null);
    const agList=AG.map(a=>`${a.id}=${a.prefix}/${a.name}`).join(", ");
    const prompt=`Você é assistente de um consultor BB Consórcio.
Agências disponíveis (id=prefixo/nome): ${agList}
Tipos: normal, qualificado, visita
Extraia JSON SOMENTE sem markdown:
{"agencyId":"","type":"normal","manager":"","wallet":"","clientDoc":"","docType":"cpf","cotacao":"","obs":"","hasPend":false,"pendReturn":""}
Texto: "${aiText}"`;
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:400,messages:[{role:"user",content:prompt}]})
      });
      const d=await r.json();
      const txt=d.content?.map(c=>c.text||"").join("")||"";
      const parsed=JSON.parse(txt.replace(/```json|```/g,"").trim());
      const ag=AG.find(a=>a.id===parsed.agencyId||a.prefix===parsed.agencyId);
      setAiResult({...parsed,agencyId:ag?.id||"",agName:ag?`${ag.prefix} — ${ag.name}`:""});
    }catch{ setAiResult({error:"Não consegui interpretar. Tente ser mais específico."}); }
    setAiLoading(false);
  }

  function saveAIDirectly(){
    if(!aiResult||aiResult.error) return;
    const rec={...emptyForm,...aiResult,id:Date.now(),date:TODAY,time:nowT()};
    setAtts(a=>[rec,...a]);
    if(rec.hasPend&&rec.obs){

                <div style={{flex:1,overflowY:"auto"}}>
                  <div style={{display:"flex",borderBottom:`1px solid ${C.border}`}}>
                    {[["mensal","Mensal"],["semestral","Semestral"]].map(([k,l])=>(
                      <button key={k} style={{flex:1,padding:"9px",textAlign:"center",fontSize:12,fontWeight:700,
                        color:visitView===k?C.gold:C.muted,borderBottom:visitView===k?`2px solid ${C.gold}`:"2px solid transparent",
                        cursor:"pointer",background:"none",border:"none",fontFamily:"inherit"}} onClick={()=>setVisitView(k)}>{l}</button>
                    ))}
                  </div>

                  <div style={{padding:"12px 14px 20px"}}>
                    {/* Summary bar */}
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.goldFade,borderRadius:9,padding:"9px 13px",marginBottom:14}}>
                      {visitView==="mensal"?(
                        <><span style={{fontSize:12,color:C.gold}}>Visitas em {fmtYM(visitMonth)}</span><span style={{fontSize:18,fontWeight:900,color:C.gold}}>{totalMes} <span style={{fontSize:11,color:C.muted}}>/ {MONTHLY_VISIT_META}</span></span></>
                      ):(
                        <><span style={{fontSize:12,color:C.gold}}>Prefixos visitados no semestre</span><span style={{fontSize:18,fontWeight:900,color:C.gold}}>{totalVisitSem} <span style={{fontSize:11,color:C.muted}}>/ {SEM_VISIT_META}</span></span></>
                      )}
                    </div>

                    {GROUPS.map(grp=>(
                      <div key={grp} style={{marginBottom:16}}>
                        <div style={{fontSize:9,color:C.muted,letterSpacing:1.5,textTransform:"uppercase",marginBottom:8}}>{grp}</div>
                        <div style={{display:"flex",flexDirection:"column",gap:8}}>
                          {AG.filter(a=>a.group===grp).map(ag=>{
                            const count=(monthVisits[visitMonth]||{})[ag.id]||0;
                            const semVisited=allVisitedSem.has(ag.id);
                            const active=visitView==="mensal"?count>0:semVisited;
                            return(
                              <div key={ag.id}
                                onClick={()=>visitView==="mensal"&&count===0&&markVisit(ag.id,visitMonth)}
                                style={{background:active?"rgba(34,197,94,0.12)":"rgba(255,255,255,0.04)",
                                  border:`1px solid ${active?"#22c55e55":C.border}`,
                                  borderRadius:12,padding:"12px 14px",
                                  cursor:visitView==="mensal"&&count===0?"pointer":"default",
                                  display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                <div>
                                  <div style={{fontSize:14,fontWeight:700,color:active?C.green:C.text}}>{ag.prefix}</div>
                                  <div style={{fontSize:12,color:active?C.green:C.muted,marginTop:2}}>{ag.name}</div>
                                  {visitView==="semestral"&&<div style={{fontSize:10,marginTop:3,color:semVisited?C.green:C.orange}}>{semVisited?"✓ Visitada no semestre":"○ Não visitada"}</div>}
                                </div>
                                {visitView==="mensal"&&(
                                  count>0?(
                                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                                      <button onClick={e=>{e.stopPropagation();unmarkVisit(ag.id,visitMonth);}} style={{background:"rgba(239,68,68,0.2)",border:"none",color:C.red,borderRadius:8,padding:"4px 10px",fontSize:16,cursor:"pointer",fontWeight:700}}>−</button>
                                      <span style={{background:C.green,color:"#fff",borderRadius:12,padding:"3px 10px",fontSize:12,fontWeight:700,minWidth:32,textAlign:"center"}}>{count}x</span>
                                      <button onClick={e=>{e.stopPropagation();markVisit(ag.id,visitMonth);}} style={{background:"rgba(34,197,94,0.2)",border:"none",color:C.green,borderRadius:8,padding:"4px 10px",fontSize:16,cursor:"pointer",fontWeight:700}}>+</button>
                                    </div>
                                  ):(
                                    <button onClick={e=>{e.stopPropagation();markVisit(ag.id,visitMonth);}}
                                      style={{background:C.goldFade,border:`1px solid ${C.gold}44`,color:C.gold,borderRadius:8,padding:"6px 14px",fontSize:12,cursor:"pointer",fontWeight:700}}>
                                      + Marcar
                                    </button>
                                  )
                                )}
                                {visitView==="semestral"&&semVisited&&(
                                  <div style={{color:C.green,fontSize:18}}>✓</div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}
          </div>
        </div>
      )}

      {/* SETTINGS MODAL */}
      {settingsModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:60,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>{if(e.target===e.currentTarget)setSettingsModal(false);}}>
          <div style={{background:"#0d1630",border:`1px solid ${C.gold}55`,borderRadius:16,padding:20,width:"100%",maxWidth:360}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
              <div style={{fontSize:14,fontWeight:700,color:C.gold}}>⚙️ Configurações</div>
              <button style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:18}} onClick={()=>setSettingsModal(false)}>✕</button>
            </div>
            <label style={S.lbl}>Seu Nome</label>
            <input style={S.inp} value={editNameVal} onChange={e=>setEditNameVal(e.target.value)}/>
            <button style={{...S.btn(C.gold,"#001f3f"),width:"100%",padding:"12px",fontSize:14,marginBottom:10}} onClick={()=>{if(editNameVal.trim()){setUserName(editNameVal.trim());setSettingsModal(false);}}}>
              ✓ Salvar Nome
            </button>
            <button style={{...S.btn("rgba(96,165,250,0.15)",C.blue),width:"100%",padding:"10px",fontSize:13,marginBottom:10}} onClick={()=>{setSettingsModal(false);setAgenciesModal(true);}}>
              🏦 Gerenciar Agências
            </button>
            <button style={{...S.btn("rgba(239,68,68,0.15)",C.red),width:"100%",padding:"10px",fontSize:13}} onClick={()=>{setLoggedIn(false);setSettingsModal(false);}}>
              Sair / Trocar usuário
            </button>
          </div>
        </div>
      )}

      {/* AGENCIES MODAL */}
      {agenciesModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:60,display:"flex",flexDirection:"column"}}>
          <div style={{background:"#0d1630",borderBottom:`1px solid ${C.gold}55`,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0}}>
            <div style={{fontSize:14,fontWeight:700,color:C.gold}}>🏦 Gerenciar Agências</div>
            <button style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:18}} onClick={()=>{setAgenciesModal(false);setEditingAg(null);setAgForm({prefix:"",name:"",group:"SUP RONDONIA"});}}>✕</button>
          </div>
          <div style={{overflowY:"auto",padding:"14px 14px 30px",flex:1}}>
            {/* Add/Edit form */}
            <div style={{...S.card,border:`1px solid ${C.gold}44`,background:`rgba(245,197,24,0.04)`,marginBottom:16}}>
              <div style={S.sec}>{editingAg?"✏️ Editar Agência":"➕ Nova Agência"}</div>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <div style={{flex:"0 0 90px"}}>
                  <label style={S.lbl}>Prefixo</label>
                  <input style={{...S.inp,marginBottom:0}} placeholder="Ex: 102" value={agForm.prefix} onChange={e=>setAgForm(f=>({...f,prefix:e.target.value}))}/>
                </div>
                <div style={{flex:1}}>
                  <label style={S.lbl}>Nome</label>
                  <input style={{...S.inp,marginBottom:0}} placeholder="Ex: PORTO VELHO" value={agForm.name} onChange={e=>setAgForm(f=>({...f,name:e.target.value}))}/>
                </div>
              </div>
              <label style={S.lbl}>Grupo</label>
              <div style={{display:"flex",gap:7,marginBottom:12}}>
                {["SUP RONDONIA","PRESIDENTE DUTRA","ESC"].map(g=>(
                  <button key={g} style={{...S.chip(C.gold,agForm.group===g),flex:1,textAlign:"center",fontSize:10}} onClick={()=>setAgForm(f=>({...f,group:g}))}>{g.split(" ")[0]}</button>
                ))}
              </div>
              <div style={{display:"flex",gap:8}}>
                <button style={{...S.btn(C.gold,"#001f3f"),flex:1,padding:"10px"}} onClick={saveAgency}>
                  {editingAg?"✓ Salvar":"+ Adicionar"}
                </button>
                {editingAg&&<button style={{...S.btn("rgba(255,255,255,0.07)",C.muted,"10px 14px")}} onClick={()=>{setEditingAg(null);setAgForm({prefix:"",name:"",group:"SUP RONDONIA"});}}>Cancelar</button>}
              </div>
            </div>

            {/* Agency list by group */}
            {GROUPS.map(grp=>(
              <div key={grp} style={{marginBottom:14}}>
                <div style={S.sec}>{grp}</div>
                {AG.filter(a=>a.group===grp).map(ag=>(
                  <div key={ag.id} style={{...S.card,marginBottom:8,padding:"10px 14px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div>
                        <span style={{fontWeight:700,color:C.gold,fontSize:13}}>{ag.prefix}</span>
                        <span style={{color:C.text,fontSize:12,marginLeft:8}}>{ag.name}</span>
                      </div>
                      <div style={{display:"flex",gap:6}}>
                        <button style={S.btn("rgba(96,165,250,0.15)",C.blue,"5px 10px")} onClick={()=>startEditAg(ag)}>✏️</button>
                        <button style={S.btn("rgba(239,68,68,0.15)",C.red,"5px 10px")} onClick={()=>deleteAgency(ag.id)}>✕</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );

  // ── REGISTER ────────────────────────────────────────────────────────────
  if(screen==="register"){
    const isVisita=form.type==="visita";
    const isNormal=form.type==="normal";
    const isQual=!isVisita&&!isNormal;
    const selAg=AG.find(a=>a.id===form.agencyId);
    return(
      <div style={S.app}>
        <div style={S.hdr}><button style={S.btn("rgba(255,255,255,0.07)",C.muted,"6px 11px")} onClick={()=>setScreen("home")}>← Voltar</button><span style={{fontSize:13,fontWeight:700,color:C.gold}}>Registrar Atendimento</span><button style={S.btn(C.gold,"#001f3f","6px 13px")} onClick={saveAtt}>Salvar</button></div>
        <div style={S.main}>
          <div style={S.card}>
            <div style={{display:"flex",gap:9,marginBottom:9}}>
              <div style={{flex:1}}><label style={S.lbl}>Data</label><input type="date" style={S.inp} value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
              <div style={{flex:1}}><label style={S.lbl}>Horário</label><input type="time" style={S.inp} value={form.time} onChange={e=>setForm(f=>({...f,time:e.target.value}))}/></div>
            </div>

            <label style={S.lbl}>Tipo de Atendimento</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:11}}>{ATT_TYPES.map(t=>(<button key={t.id} style={S.chip(t.color,form.type===t.id)} onClick={()=>setForm(f=>({...f,type:t.id,manager:"",wallet:"",clientDoc:"",obs:"",cotacao:""}))}>{t.short}</button>))}</div>

            <label style={S.lbl}>Prefixo / Agência</label>
            <select style={S.inp} value={form.agencyId} onChange={e=>setForm(f=>({...f,agencyId:e.target.value,wallet:""}))}>
              <option value="">Selecione...</option>
              {GROUPS.map(grp=>(<optgroup key={grp} label={grp}>{AG.filter(a=>a.group===grp).map(a=>(<option key={a.id} value={a.id}>{a.prefix} — {a.name}</option>))}</optgroup>))}
            </select>

            {/* NORMAL — nome do cliente + obs + pendência */}
            {isNormal&&<>
              <label style={S.lbl}>Nome do Cliente</label>
              <input style={S.inp} placeholder="Nome do cliente" value={form.manager} onChange={e=>setForm(f=>({...f,manager:e.target.value}))}/>
              <label style={S.lbl}>Observações</label>
              <textarea style={S.txta} placeholder="Assunto abordado..." value={form.obs} onChange={e=>setForm(f=>({...f,obs:e.target.value}))}/>
            </>}

            {/* QUALIFICADO — nome + carteira + CPF/CNPJ/MCI + cotação + obs */}
            {isQual&&<>
              <label style={S.lbl}>Nome do Cliente</label>
              <input style={S.inp} placeholder="Nome do cliente" value={form.manager} onChange={e=>setForm(f=>({...f,manager:e.target.value}))}/>

              <label style={S.lbl}>Carteira</label>
              {selAg&&selAg.wallets.length>1?(
                <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:10}}>{selAg.wallets.map(w=>(<button key={w} style={S.chip(C.blue,form.wallet===String(w))} onClick={()=>setForm(f=>({...f,wallet:String(w)}))}>{w}</button>))}</div>
              ):(
                <input style={S.inp} placeholder="Número da carteira" value={form.wallet} onChange={e=>setForm(f=>({...f,wallet:e.target.value}))}/>
              )}

              <label style={S.lbl}>Identificação</label>
              <div style={{display:"flex",gap:8,marginBottom:9}}>{["cpf","cnpj","mci"].map(tp=>(<button key={tp} style={{...S.chip(C.blue,form.docType===tp),flex:1,textAlign:"center"}} onClick={()=>setForm(f=>({...f,docType:tp}))}>{tp.toUpperCase()}</button>))}</div>
              <input style={S.inp} placeholder={form.docType==="cpf"?"000.000.000-00":form.docType==="cnpj"?"00.000.000/0000-00":"Número MCI"} value={form.clientDoc} onChange={e=>setForm(f=>({...f,clientDoc:e.target.value}))}/>

              <label style={S.lbl}>Valor da Cotação (R$)</label>
              <input type="number" style={S.inp} placeholder="Ex: 50000" value={form.cotacao||""} onChange={e=>setForm(f=>({...f,cotacao:e.target.value}))}/>

              <label style={S.lbl}>Observações</label>
              <textarea style={S.txta} placeholder="Produto, situação, próximos passos..." value={form.obs} onChange={e=>setForm(f=>({...f,obs:e.target.value}))}/>
            </>}

            {/* VISITA — só prefixo, já selecionado acima */}
            {isVisita&&<>
              <label style={S.lbl}>Observações (opcional)</label>
              <textarea style={S.txta} placeholder="Observações da visita..." value={form.obs} onChange={e=>setForm(f=>({...f,obs:e.target.value}))}/>
            </>}

            {/* Pendência — para todos exceto visita */}
            {!isVisita&&<>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:form.hasPend?10:0}}>
                <input type="checkbox" id="hp" checked={form.hasPend} onChange={e=>setForm(f=>({...f,hasPend:e.target.checked}))} style={{width:16,height:16,cursor:"pointer"}}/>
                <label htmlFor="hp" style={{fontSize:12,color:C.orange,cursor:"pointer"}}>⏳ Ficou pendente / precisa de retorno</label>
              </div>
              {form.hasPend&&<><label style={S.lbl}>Data de Retorno</label><input type="date" style={S.inp} value={form.pendReturn} onChange={e=>setForm(f=>({...f,pendReturn:e.target.value}))}/></>}
            </>}
          </div>
        </div>
      </div>
    );
  }

  // ── REPORT ──────────────────────────────────────────────────────────────
  if(screen==="report"){
    const dates=[...new Set(atts.map(a=>a.date))].sort((a,b)=>b.localeCompare(a));
    const txt=buildReport(selDate);
    return(
      <div style={S.app}>
        <div style={S.hdr}><button style={S.btn("rgba(255,255,255,0.07)",C.muted,"6px 11px")} onClick={()=>setScreen("home")}>← Voltar</button><span style={{fontSize:13,fontWeight:700,color:C.gold}}>Relatório Diário</span><button style={S.btn(C.gold,"#001f3f","6px 12px")} onClick={()=>navigator.clipboard?.writeText(txt).then(()=>alert("Copiado!"))}>Copiar</button></div>
        <div style={S.main}>
          <label style={S.lbl}>Data</label>
          <select style={S.inp} value={selDate} onChange={e=>setSelDate(e.target.value)}>{[TODAY,...dates.filter(d=>d!==TODAY)].map(d=>(<option key={d} value={d}>{fmtDate(d)}{d===TODAY?" (Hoje)":""}</option>))}</select>
          <div style={{background:"#fff",color:"#111",borderRadius:11,padding:18,fontFamily:"monospace",fontSize:12.5,lineHeight:1.75,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{txt}</div>
          <div style={{fontSize:10,color:C.muted,textAlign:"center",marginTop:10}}>Copie e cole no WhatsApp, e-mail ou sistema de lançamento</div>
        </div>
      </div>
    );
  }
  return null;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
